name: Build rootless tweak

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: brew install dpkg ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK with private frameworks
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"

      - name: Build package
        run: make clean package FINALPACKAGE=1

      - name: Show package contents
        run: |
          dpkg-deb -I packages/*.deb
          dpkg-deb -c packages/*.deb
          if dpkg-deb -c packages/*.deb | grep -q "var/jb/var/jb"; then echo "ERROR: double /var/jb prefix"; exit 1; fi
          dpkg-deb -c packages/*.deb | grep -q "Library/PreferenceBundles/IOS26CCStylePrefs.bundle/IOS26CCStylePrefs" || { echo "ERROR: prefs bundle missing"; exit 1; }
          dpkg-deb -c packages/*.deb | grep -q "Library/PreferenceLoader/Preferences/IOS26CCStyle.plist" || { echo "ERROR: PreferenceLoader entry missing"; exit 1; }
          dpkg-deb -c packages/*.deb | grep -q "MobileSubstrate/DynamicLibraries/IOS26CCBackboardd.dylib" || { echo "ERROR: backboardd dylib missing"; exit 1; }
          dpkg-deb -c packages/*.deb | grep -q "MobileSubstrate/DynamicLibraries/IOS26CCBackboardd.plist" || { echo "ERROR: backboardd filter plist missing"; exit 1; }

      - name: Read version
        run: echo "PKG_VERSION=$(sed -n 's/^Version: //p' control)" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: IOS26CCStyle-rootless-deb-v${{ env.PKG_VERSION }}
          path: packages/*.deb
