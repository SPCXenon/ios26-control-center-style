name: Build rootless tweak

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: brew install dpkg ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      - name: Install patched iOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"

      - name: Build package
        run: make clean package FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: IOS26CCStyle-rootless-deb
          path: packages/*.deb
